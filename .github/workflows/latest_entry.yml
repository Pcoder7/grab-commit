# ====================================================================
#              Automated Audit of Latest Workflow Commit
#
# This version has been corrected to use job-level environment
# variables for better scoping and clarity, as requested.
# ====================================================================

name: "Automated Audit: Extract Latest Recon Data"

on:
  workflow_run:
    workflows: ["permutate.yml"]
    types:
      - completed
      
  workflow_dispatch:
      

jobs:
  extract_latest_commit_data:
    # Only run if the triggering workflow was a success.
    #if: github.event.workflow_run.conclusion == 'success'
    
    name: Extract Data From Latest Commit
    runs-on: ubuntu-latest
    env:
      STORE_OWNER: ${{ secrets.SECONDRY_USERNAME }}
      STORE_REPO_NAME: ${{ secrets.STORE }}
      STORE_TOKEN: ${{ secrets.PAT_FOR_SECONDRY }}

    steps:
      # Step 1: Checkout the private 'store-recon' repository.
      # This step correctly uses the job-level environment variables.
      - name: Checkout the private store-recon repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.STORE_OWNER }}/${{ env.STORE_REPO_NAME }}
          token: ${{ env.STORE_TOKEN }}
          fetch-depth: 0

      # Step 2: Configure Git to disable color output for this job

      - name: Configure Git for Scripting
        run: git config --global color.ui never
        
      # Step 3: Find the single most recent commit and extract its data
      - name: Extract Latest Entries from Target Files
        id: extract_entries
        shell: bash
        run: |
          set -e
          # --- Configuration: Define all your patterns here ---
          # To add a new pattern, just add a new line inside the PATTERNS variable.
          # The script will handle the rest automatically.
          PATTERNS=$(cat <<'EOF'
          feat: Add new assets from distributed permutation scan with Correlation ID:
          feat(recon): Automated http-multiple results from Correlation ID:
          EOF
          )
          # This converts the multi-line string into a single regex with '|' (OR) separators.          # This converts the multi-line string into a single regex with '|' (OR) separators.
          GREP_PATTERN=$(echo "$PATTERNS" | sed 's/[.*+?^${}()|[\]\\]/\\&/g' | paste -sd '|')

          # --- Block 1: Find the Single Latest Commit Matching Any Pattern ---
          printf "::group::[DEBUG] Block 1: Finding the latest commit\n"
          echo "   → Searching for the latest commit matching any of the defined patterns..."
          
          # Find the hash of the single most recent commit (-n1) that matches the combined regex pattern.
          LATEST_COMMIT_HASH=$(git log --no-merges -E --grep="$GREP_PATTERN" -n1 --format=%H || true)
          
          if [ -z "$LATEST_COMMIT_HASH" ]; then
            printf "::error::Could not find any commits matching the required patterns.\n"
            exit 1 # This is a fatal error, so we fail the job.
          fi
          
          COMMIT_MESSAGE=$(git log -1 --format=%B "$LATEST_COMMIT_HASH")
          echo "✅ Found latest commit:"
          echo "   → Hash: $LATEST_COMMIT_HASH"
          echo "   → Message: $COMMIT_MESSAGE"
          printf "::endgroup::\n"

          # --- Configuration for file targeting ---
          TARGET_PATHSPEC="results/*/puredns_result.txt"
          
          # --- Block 2: Generate a Diff for the Single Commit ---
          printf "::group::[DEBUG] Block 2: Generating raw diff for the commit\n"
          
          # Use 'git show' which is designed to display the changes from a single commit.
          git show "$LATEST_COMMIT_HASH" --unified=0 -- "$TARGET_PATHSPEC" > raw_diff.log || true
          
          echo "   → Raw diff for commit $LATEST_COMMIT_HASH saved to raw_diff.log"
          printf "::endgroup::\n"
          
          # --- Block 3: Filtering Diff for Added Lines ---
          printf "::group::[DEBUG] Block 3: Filtering Diff for added lines\n"
          grep '^\+' raw_diff.log --color=never | grep -vE '^\+\+\+' --color=never | awk -F' ' '{print $1}' | awk '{for(i=1;i<=NF;i++){gsub(/^\+/, "", $i); print $i}}' > latest_entries.txt || true
          printf "::endgroup::\n"
          
          # --- Block 4: Final Validation ---
          printf "::group::[DEBUG] Block 4: Final Validation\n"
          COUNT=$(wc -l < latest_entries.txt)
          
          # CORRECTED SYNTAX: Replaced '{' with 'then' and removed the closing '}'
          if [ "$COUNT" -eq 0 ]; then
            # This is now a warning, as a commit might legitimately not add new lines to the target files.
            printf "::warning::No new content lines were found in commit %s for the target files.\n" "$LATEST_COMMIT_HASH"
            exit 0 
          fi

          echo "✅ Successfully extracted $COUNT new entries from commit $LATEST_COMMIT_HASH into latest_entries.txt"
          printf "::endgroup::\n"
    

          #git show -m "$LATEST_COMMIT_HASH" | grep '^\+' | grep -v '^\+\+\+' > latest_entries.txt || true

      # Step 3: Upload the extracted data as a downloadable artifact.
      - name: Upload Latest Entries as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "new-entries-from-run-${{ github.event.workflow_run.id }}"
          path: latest_entries.txt
          retention-days: 1

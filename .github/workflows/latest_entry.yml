# ====================================================================
#              Automated Audit of Latest Workflow Commit
#
# This version has been corrected to use job-level environment
# variables for better scoping and clarity, as requested.
# ====================================================================

name: "Automated Audit: Extract Latest Recon Data"

on:
  workflow_run:
    workflows: ["permutate.yml"]
    types:
      - completed
      
  workflow_dispatch:
      

jobs:
  extract_latest_commit_data:
    # Only run if the triggering workflow was a success.
    #if: github.event.workflow_run.conclusion == 'success'
    
    name: Extract Data From Latest Commit
    runs-on: ubuntu-latest
    env:
      STORE_OWNER: ${{ secrets.SECONDRY_USERNAME }}
      STORE_REPO_NAME: ${{ secrets.STORE }}
      STORE_TOKEN: ${{ secrets.PAT_FOR_SECONDRY }}

    steps:
      # Step 1: Checkout the private 'store-recon' repository.
      # This step correctly uses the job-level environment variables.
      - name: Checkout the private store-recon repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.STORE_OWNER }}/${{ env.STORE_REPO_NAME }}
          token: ${{ env.STORE_TOKEN }}
          fetch-depth: 0

      # Step 2: Configure Git to disable color output for this job

      - name: Configure Git for Scripting
        run: git config --global color.ui never
        
      # Step 3: Find the single most recent commit and extract its data
      - name: Mark Directory as Safe
        shell: bash
        run: |
          # This command tells Git to trust the current repository directory,
          # resolving the "dubious ownership" error.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
      - name: Extract Latest puredns-permut Entries
        id: extract_entries
        shell: bash
        run: |
          
          # The Correlation ID is the unique run_id from the puredns-permut workflow
          CORRELATION_ID="17188854188"
          
          FULL_PATTERN="feat: Add new assets from distributed permutation scan from Correlation ID: ${CORRELATION_ID}"
          TARGET_PATHSPEC="results/*/puredns_result.txt"

          echo "-> Searching for commits with the exact pattern: '$FULL_PATTERN'"
          
          # This command now finds ALL commits that match the FULL pattern.
          # This correctly groups the Primary, Secondary, and Tertiary commits.
          COMMIT_LIST=$(git log --no-merges --grep="$FULL_PATTERN" --format="%H")
          # ====================================================================

          if [ -z "$COMMIT_LIST" ]; then
            echo "::error::No commits found for Correlation ID '$CORRELATION_ID' with the specified pattern. Cannot proceed."
            exit 0
          fi

          LATEST_COMMIT=$(echo "$COMMIT_LIST" | head -n 1)
          OLDEST_COMMIT=$(echo "$COMMIT_LIST" | tail -n 1)

          echo "-> Found commit(s) to process for this run: $COMMIT_LIST"

          # This logic correctly generates a combined diff of all changes across all correlated commits.
          if git rev-parse --verify $OLDEST_COMMIT^ >/dev/null 2>&1; then
            git diff "$OLDEST_COMMIT^" "$LATEST_COMMIT" --unified=0 -- "$TARGET_PATHSPEC" > raw_diff.log || true
          else
            git show "$LATEST_COMMIT" --unified=0 -- "$TARGET_PATHSPEC" > raw_diff.log || true
          fi
          
          # This filters the diff to get the clean list of subdomains and saves it as the input.
          grep '^\+' raw_diff.log | awk '{print $1}' | sed 's/^+//' > subdomains.txt

          COUNT=$(wc -l < subdomains.txt)
          if [ "$COUNT" -eq 0 ]; then
             echo "::warning::While commits were found, no new subdomains were extracted after filtering."
          fi
          echo "✅ Successfully extracted $COUNT new entries into subdomains.txt"
    

          #git show -m "$LATEST_COMMIT_HASH" | grep '^\+' | grep -v '^\+\+\+' > latest_entries.txt || true

      # Step 3: Upload the extracted data as a downloadable artifact.
      - name: Upload Latest Entries as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "new-entries-from-run-${{ github.event.workflow_run.id }}"
          path: latest_entries.txt
          retention-days: 1
